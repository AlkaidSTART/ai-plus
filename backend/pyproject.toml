[project]
name = "insightx-backend"
version = "0.1.0"
description = "InsightX AI 市场洞察后端：单包双入口（FastAPI API + 独立 worker），uv 管理"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",  # 仅 Alembic 同步迁移使用
  "alembic>=1.13",
  "pgvector>=0.3",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
