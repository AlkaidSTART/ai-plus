name: insightx

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://insightx:${POSTGRES_PASSWORD:-insightx-dev}@db:5432/insightx
  REDIS_URL: redis://redis:6379/0
  AUTH_MODE: dev
  DEV_TENANT_ID: dev-tenant

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: insightx
      POSTGRES_USER: insightx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightx-dev}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightx -d insightx"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    image: insightx-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: insightx-api:local
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment: *backend-environment
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  db_data:
  redis_data:
