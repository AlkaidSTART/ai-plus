services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: insightx
      POSTGRES_PASSWORD: insightx
      POSTGRES_DB: insightx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: prod
      PROVIDER_MODE: real
      TASK_STORE_BACKEND: db
      EVENT_STORE_BACKEND: redis
      DATABASE_URL: postgresql+asyncpg://insightx:insightx@postgres:5432/insightx
      REDIS_URL: redis://redis:6379/0
      BACKEND_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
