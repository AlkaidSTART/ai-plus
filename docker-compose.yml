services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: insightx
      POSTGRES_PASSWORD: insightx
      POSTGRES_DB: insightx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+asyncpg://insightx:insightx@postgres:5432/insightx
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+asyncpg://insightx:insightx@postgres:5432/insightx
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # P0：worker 当前为空轮询（阶段 04 接入真实执行），仅验证启动与数据库连通。
  worker:
    build: ./backend
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+asyncpg://insightx:insightx@postgres:5432/insightx
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  pgdata:
